name = "basin-utemezo"
main = "worker.js"
compatibility_date = "2026-08-13"

# Félóránként, a 4. és a 34. percben (UTC) — de nem cronnal. A fiók ingyenes
# Workers-csomagjában az 5 cron-hely foglalt, ezért egy Durable Object riasztása
# lépteti a láncot (lásd worker.js). Az üres lista a korábbi cron-kísérletet is
# törli. A repó nyilvános, így a GitHub Actions-futások díjmentesek.
[triggers]
crons = []

[[durable_objects.bindings]]
name = "UTEMEZO"
class_name = "BasinUtemezo"

[[migrations]]
tag = "v1-basin-utemezo"
new_sqlite_classes = ["BasinUtemezo"]

[observability]
enabled = true
