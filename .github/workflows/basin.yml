name: basin

# Óránként a mércék, hajnalban a légköri tagok is.
# A gépedtől függetlenül fut — nem kell, hogy a Mac ébren legyen.
on:
  schedule:
    - cron: "7 * * * *"      # minden óra 7. percében (UTC)
  workflow_dispatch:          # kézi indítás is

concurrency:                  # ne fusson két példány egyszerre az archívumra
  group: basin
  cancel-in-progress: false

permissions:
  contents: write             # az archiv/ visszaírásához

jobs:
  frissit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Függőségek
        run: pip install cdsapi earthaccess xarray netCDF4 h5netcdf numpy

      - name: Hitelesítés a titkokból
        env:
          CDS_TOKEN: ${{ secrets.CDS_TOKEN }}
          LSASAF_USER: ${{ secrets.LSASAF_USER }}
          LSASAF_PASS: ${{ secrets.LSASAF_PASS }}
          EARTHDATA_USER: ${{ secrets.EARTHDATA_USER }}
          EARTHDATA_PASS: ${{ secrets.EARTHDATA_PASS }}
        run: |
          printf 'url: https://cds.climate.copernicus.eu/api\nkey: %s\n' \
            "$CDS_TOKEN" > ~/.cdsapirc
          {
            printf 'machine datalsasaf.lsasvcs.ipma.pt login %s password %s\n' \
              "$LSASAF_USER" "$LSASAF_PASS"
            printf 'machine urs.earthdata.nasa.gov login %s password %s\n' \
              "$EARTHDATA_USER" "$EARTHDATA_PASS"
          } > ~/.netrc
          chmod 600 ~/.cdsapirc ~/.netrc

      - name: Futtatás
        run: |
          chmod +x frissit.sh
          ./frissit.sh

      - name: Archívum visszaírása
        run: |
          git config user.name  "basin-bot"
          git config user.email "basin-bot@users.noreply.github.com"
          git add archiv params.json
          git diff --staged --quiet || git commit -m "adat: $(date -u +%FT%TZ)"
          # A munkafa maradékát eldobjuk, hogy a rebase ne akadjon el.
          # FONTOS: ez a commit UTÁN jön, különben a jelzőfájl változása elveszne.
          git checkout -- . 2>/dev/null || true
          git fetch origin main
          # A rebase-nél a MI verziónk nyer: a bot friss adata felülírja a
          # repóban lévőt. A -X ours fordítva működik rebase alatt (a rebase
          # szempontjából "ours" a felsőbb ág), ezért -X theirs kell.
          git rebase -X theirs origin/main || { git rebase --abort; git reset --hard origin/main; exit 0; }
          git push origin HEAD:main

      - name: Publikálás Cloudflare Pages-re
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # A publikálandó fájlok. A data.json és a data.js a futásból frissen áll elő;
          # a statikus fájlok a repóból jönnek. Bármelyik kihagyása azt jelenti, hogy a
          # bot következő futása letörli a lapról — ez korábban a logóval megtörtént.
          mkdir -p _publish
          cp index.html data.js data.json logo.png logo.svg terkep.json \
             robots.txt sitemap.xml googled3302b927f898901.html \
             favicon.ico favicon-32.png apple-touch-icon.png _publish/
          npx --yes wrangler pages deploy _publish \
            --project-name basin --commit-dirty=true
